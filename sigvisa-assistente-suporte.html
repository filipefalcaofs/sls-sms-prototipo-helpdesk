<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SIGVISA · Assistente de suporte</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1520;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f8fafc;
    }

    .fallback {
      position: fixed;
      inset: auto 24px 24px 24px;
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      background: #ffffff;
      color: #0f172a;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
    }

    .fallback a {
      color: #005ca9;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <iframe src="index.html" title="Protótipo navegável do Assistente SIGVISA"></iframe>
  <p class="fallback">
    Se o protótipo não carregar automaticamente, abra <a href="index.html">index.html</a>.
  </p>
  <script>
    document.querySelector("iframe").addEventListener("error", () => {
      document.querySelector(".fallback").style.display = "block";
    });
  </script>
</body>
</html>
